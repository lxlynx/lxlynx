<svg xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44">
  <defs>
    <linearGradient id="nowbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="720" height="44" rx="6" fill="url(#nowbg)" stroke="#6366f1" stroke-width="0.5" opacity="0.9"/>
  <text x="12" y="20" font-family="monospace" font-size="10" fill="#8b5cf6" opacity="0.5">$</text>

  <!-- Tagline 1 -->
  <text x="26" y="20" font-family="monospace" font-size="11" fill="#6366f1">
    Making the cost of an LLM pipeline visible before the invoice arrives.
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.3;0.33;0.63;0.66;0.96;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline 2 -->
  <text x="26" y="20" font-family="monospace" font-size="11" fill="#8b5cf6">
    If a tool needs a dashboard to explain itself, I usually don't keep it.
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline 3 -->
  <text x="26" y="20" font-family="monospace" font-size="11" fill="#6366f1">
    The unglamorous layer underneath the demo: retries, rate limits, cost accounting.
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- Blinking cursor -->
  <rect x="698" y="14" width="8" height="14" fill="#8b5cf6">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
